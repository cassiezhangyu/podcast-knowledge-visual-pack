<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- v0.6.1: force Simplified Chinese glyphs. Without this, fontconfig's CJK fallback for
     Helvetica/sans-serif resolves to "Noto Sans CJK JP", whose 门/骨/直/关… use non-SC forms. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <edit name="lang" mode="assign" binding="strong"><string>zh-cn</string></edit>
  </match>
  <alias binding="strong">
    <family>Helvetica</family>
    <prefer><family>Nimbus Sans</family><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Segoe UI Emoji</family>
    <prefer><family>Noto Sans CJK SC</family><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
